name: Sonda de fuentes

# Descarga unas pocas páginas de Biota y Centinela para estudiar su estructura.
# Se lanza a mano desde la pestaña Actions o con `gh workflow run sonda.yml`.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/sonda.py
      # Los resultados se suben a una rama aparte (sonda-resultados), nunca a main
      - name: Guardar resultados en la rama sonda-resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/s && cp -r sonda/. /tmp/s/
          git checkout -q --orphan sonda-resultados
          git rm -rfq .
          rm -rf sonda
          cp -r /tmp/s/. .
          rm -f *.js
          git add -A
          git commit -qm "Resultados de la sonda"
          git push -qf origin sonda-resultados
