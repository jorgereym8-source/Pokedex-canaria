name: Enriquecer fichas

# Añade a las fichas la categoría UICN (GBIF), el tamaño, la forma, el peso, la longevidad,
# el ciclo de vida, las fotos con licencia libre, los rasgos por grupo, la conservación,
# la altitud y los sonidos. Si queda trabajo pendiente, lanza otra ronda (máximo 12).
on:
  workflow_dispatch:
    inputs:
      max_inat:
        description: "Búsquedas nuevas en iNaturalist (fotos) en esta ejecución"
        default: "3000"
      ronda:
        description: "Ronda automática (no cambiar)"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      RONDA: ${{ inputs.ronda || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas pyarrow openpyxl pypdf cryptography rasterio
      - run: python scripts/enriquecer.py
        continue-on-error: true
      - run: python scripts/fotos.py --max-inat "${{ inputs.max_inat || '3000' }}"
        continue-on-error: true
      - run: python scripts/rasgos.py
        continue-on-error: true
      - run: python scripts/conservacion.py
        continue-on-error: true
      - run: python scripts/registros.py --minutos 80
        continue-on-error: true
      - run: python scripts/sonidos.py
        continue-on-error: true
        env:
          XC_KEY: ${{ secrets.XC_KEY }}
          MINUTOS_SONIDOS: "40"
      - name: Guardar datos
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -qm "Datos: enriquecimiento, fotos, rasgos, conservación, registros y sonidos ($(date -u +%F), ronda $RONDA)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
      - name: Seguir en otra ronda
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resto=$(python scripts/pendientes.py enriquecimiento)
          echo "Búsquedas pendientes: $resto"
          if [ "$resto" -gt 0 ] && [ "$RONDA" -lt 12 ]; then
            gh workflow run enriquecer.yml --ref main -f max_inat="${{ inputs.max_inat || '3000' }}" -f ronda=$((RONDA + 1))
          fi
