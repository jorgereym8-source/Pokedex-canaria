name: Enriquecer fichas

# Añade a las fichas la categoría UICN (GBIF), el tamaño, la forma, el peso,
# la longevidad y el ciclo de vida. Se ejecuta también al final de «Datos de especies».
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas pyarrow
      - run: python scripts/enriquecer.py
      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -qm "Datos: UICN, tamaños y longevidad ($(date -u +%F))"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
