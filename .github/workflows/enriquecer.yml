name: Enriquecer fichas

# Añade a las fichas la categoría UICN (GBIF), el tamaño, la forma, el peso,
# la longevidad, el ciclo de vida y las fotos con licencia libre (Commons e iNaturalist).
# Se ejecuta también al final de «Datos de especies».
on:
  workflow_dispatch:
    inputs:
      max_inat:
        description: "Búsquedas nuevas en iNaturalist (fotos) en esta ejecución"
        default: "2300"

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas pyarrow openpyxl pypdf cryptography rasterio
      - run: python scripts/enriquecer.py
      - run: python scripts/fotos.py --max-inat "${{ inputs.max_inat || '2300' }}"
        continue-on-error: true
      - run: python scripts/rasgos.py
        continue-on-error: true
      - run: python scripts/conservacion.py
        continue-on-error: true
      - run: python scripts/registros.py
        continue-on-error: true
      - run: python scripts/sonidos.py
        continue-on-error: true
        env:
          XC_KEY: ${{ secrets.XC_KEY }}
      - name: Guardar datos
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -qm "Datos: enriquecimiento, fotos, rasgos, conservación, registros y sonidos ($(date -u +%F))"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
