name: Datos de especies

# Descarga los datos de Biota y Centinela y los guarda en datos/.
# Se ejecuta sola el día 3 de cada mes y también a mano desde Actions.
on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de taxones por grupo (0 = todos). Con límite, el resultado va a la rama datos-prueba."
        default: "0"
  schedule:
    - cron: "23 2 3 * *"

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      LIMITE: ${{ inputs.limite || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: python scripts/descargar.py --limite "$LIMITE"
      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios en los datos"; exit 0; fi
          if [ "$LIMITE" = "0" ]; then
            git commit -qm "Datos: actualización desde Biota y Centinela ($(date -u +%F))"
            git pull --rebase -q origin main
            git push -q origin HEAD:main
          else
            git commit -qm "Datos de prueba (límite $LIMITE por grupo)"
            git push -qf origin HEAD:datos-prueba
          fi
