name: Datos de especies

# Descarga los datos de Biota y Centinela y los completa con el resto de fuentes.
# Se ejecuta sola el día 3 de cada mes y también a mano desde Actions.
# Si quedan fichas por descargar, lanza otra ronda; al terminar, encadena «Enriquecer fichas».
on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de taxones por grupo (0 = todos). Con límite, el resultado va a la rama datos-prueba."
        default: "0"
      minutos:
        description: "Minutos para descargar fichas de Biota en esta ronda"
        default: "150"
      enriquecer:
        description: "Completar después con el resto de fuentes (true/false)"
        default: "true"
      ronda:
        description: "Ronda automática (no cambiar)"
        default: "0"
  schedule:
    - cron: "23 2 3 * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      LIMITE: ${{ inputs.limite || '0' }}
      MINUTOS: ${{ inputs.minutos || '150' }}
      ENRIQ: ${{ inputs.enriquecer || 'true' }}
      RONDA: ${{ inputs.ronda || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml pandas pyarrow openpyxl pypdf cryptography rasterio
      - run: python scripts/descargar.py --limite "$LIMITE" --minutos "$MINUTOS"
      - run: python scripts/enriquecer.py
        if: env.ENRIQ == 'true'
        continue-on-error: true
      - run: python scripts/fotos.py
        if: env.ENRIQ == 'true'
        continue-on-error: true
      - run: python scripts/rasgos.py
        if: env.ENRIQ == 'true'
        continue-on-error: true
      - run: python scripts/conservacion.py
        if: env.ENRIQ == 'true'
        continue-on-error: true
      - run: python scripts/registros.py --minutos 50
        if: env.ENRIQ == 'true'
        continue-on-error: true
      - run: python scripts/sonidos.py
        if: env.ENRIQ == 'true'
        continue-on-error: true
        env:
          XC_KEY: ${{ secrets.XC_KEY }}
          MINUTOS_SONIDOS: "30"
      - name: Guardar datos
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios en los datos"; exit 0; fi
          if [ "$LIMITE" = "0" ]; then
            git commit -qm "Datos: actualización desde Biota y Centinela ($(date -u +%F), ronda $RONDA)"
            git pull --rebase -q origin main
            git push -q origin HEAD:main
          else
            git commit -qm "Datos de prueba (límite $LIMITE por grupo)"
            git push -qf origin HEAD:datos-prueba
          fi
      - name: Seguir en otra ronda
        if: ${{ !cancelled() && env.LIMITE == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fichas=$(python scripts/pendientes.py fichas)
          resto=$(python scripts/pendientes.py enriquecimiento)
          echo "Fichas pendientes: $fichas · búsquedas pendientes: $resto"
          if [ "$fichas" -gt 0 ] && [ "$RONDA" -lt 8 ]; then
            gh workflow run datos.yml --ref main -f minutos=300 -f enriquecer=false -f ronda=$((RONDA + 1))
          elif [ "$ENRIQ" != "true" ] || [ "$resto" -gt 0 ]; then
            gh workflow run enriquecer.yml --ref main -f ronda=0
          fi
